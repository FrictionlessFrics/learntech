# The overnight worker. Every night it scrapes the sources that are switched on
# (config/endpoints.toml, verified = true), commits the new data, rebuilds the
# site and publishes it to GitHub Pages. A push to main republishes without scraping.
name: Collect and publish
on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 in India
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: How long the scrapers may run
        default: "320"
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Restore the response cache, so a run cut short resumes
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: .cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Scrape
        if: github.event_name != 'push'
        run: python -m pipeline fetch --budget-minutes ${{ inputs.budget_minutes || '320' }}

      - name: Commit new data
        if: github.event_name != 'push'
        run: |
          git config user.name "fssai-dashboard bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data inbox/index.json
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Nightly data update $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Keep new press notes for review
        if: github.event_name != 'push' && hashFiles('inbox/docs/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: press-notes-${{ github.run_id }}
          path: inbox/docs
          retention-days: 30

      - run: python -m pipeline build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
