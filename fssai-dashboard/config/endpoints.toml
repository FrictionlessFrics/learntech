# Where each source lives and how its pages are laid out.
#
# Nothing here has been checked against the live portals yet. Each source stays
# switched off (verified = false) until someone opens the page in a browser,
# watches DevTools > Network while using the search, and fills in the real
# URLs and form field names below. Then set verified = true.

[hygiene]
# Old FSSAI hygiene rating directory. NOT fssai.gov.in/hygieneRating, which
# disallows bots in robots.txt.
verified = false
min_delay_seconds = 5
mode = "sweep"                        # "sweep" or "search" (see pipeline/sources/hygiene.py)

# sweep: public per-establishment pages, found via web search (Oct 2026). Open
# one in a browser and check the labels in [hygiene.labels] match the page.
detail_url = "https://hygiene.fssai.gov.in/fboDetails.php?id={id}"
start_id = 1
max_ids_per_run = 3000                # about 4-5 hours at 5 seconds a page
stop_after_missing = 500              # this many empty ids in a row = end of the list

# search: the knowRating.php form. Fill these in from DevTools before using mode = "search".
form_url = "https://hygiene.fssai.gov.in/knowRating.php"
state_field = "state"                 # name of the <select> for state on form_url
districts_url = "https://hygiene.fssai.gov.in/CHECK-IN-DEVTOOLS.php"   # the AJAX call made when a state is picked
districts_state_param = "state_id"    # what that call sends the state as
district_field = "district"
search_url = "https://hygiene.fssai.gov.in/CHECK-IN-DEVTOOLS.php"      # the POST made by the search button
extra_form_fields = {}                # any hidden fields the form also sends
page_field = ""                       # set if results are paged, e.g. "page"
max_pages = 200

# Labels on a detail page (sweep). Never add the auditor's comments: they describe
# conditions, and this project records actions only.
[hygiene.labels]
name = ["name of fbo", "fbo name", "name of establishment", "establishment name", "name of the establishment", "business name"]
licence_no = ["fssai license no", "fssai licence no", "license no", "licence no", "license number", "licence number", "fbo license no", "fbo number", "fssai number"]
address = ["address", "fbo address", "establishment address", "premises address"]
district = ["district"]
state = ["state"]
rating = ["rating", "hygiene rating", "star rating", "smiley rating"]
audit_date = ["audit date", "date of audit"]
valid_until = ["valid upto", "valid till", "validity", "rating valid upto"]
auditor = ["agency name", "auditing agency", "audit agency", "name of agency"]

# Column headings in the search results table (search).
[hygiene.columns]
name = ["establishment name", "name of establishment", "name of the establishment", "fbo name"]
address = ["address", "establishment address"]
licence_no = ["license no", "licence no", "license number", "licence number", "fssai license no", "fssai licence no"]
rating = ["rating", "hygiene rating", "star rating"]
audit_date = ["audit date", "date of audit"]
valid_until = ["valid upto", "valid till", "validity", "rating valid upto"]
auditor = ["auditing agency", "audit agency", "agency"]

[foscos]
# Licence lookup by number. Reported (Oct 2026) to use an encrypted request and
# response plus a CSRF token. We don't break that, so this stays off and licences
# are checked by hand on the FoSCoS "FBO Search" page during review. Only switch
# it on if a plain, CAPTCHA-free lookup turns up.
verified = false
min_delay_seconds = 15
lookup_url = "https://foscos.fssai.gov.in/CHECK-IN-DEVTOOLS"
method = "POST"                       # GET or POST
licence_param = "licenseNo"
public_url = "https://foscos.fssai.gov.in/"   # the page a reader can use to check a licence themselves
max_lookups_per_run = 400

[foscos.labels]
name = ["name of company", "company name", "fbo name", "name of fbo"]
address = ["premises address", "address of premises", "address"]
district = ["district"]
state = ["state"]
kind = ["license type", "licence type", "kind of business"]
status = ["status", "license status", "licence status"]
valid_until = ["valid upto", "validity", "expiry date", "valid till"]

[mh_fda]
# Maharashtra FDA press notes. Documents are collected into inbox/ for a person
# to review; facts go into data/manual/actions.csv by hand.
verified = false
min_delay_seconds = 5
listing_urls = ["https://fda.maharashtra.gov.in/CHECK-PRESS-NOTE-LISTING-PAGE"]
link_pattern = "\\.pdf$|press"
